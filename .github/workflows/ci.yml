name: HappyPlants CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:

  # ----------------------------------
  # CI — Backend Build & Test
  # ----------------------------------
  backend:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: PlantApp2/backend/plantapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify backend assets exist
        run: test -d PlantApp2/backend || echo "Backend directory not found"

  # ----------------------------------
  # CI — Frontend Validation
  # ----------------------------------
  frontend:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify frontend assets exist
        run: test -d PlantApp2/frontend || echo "Frontend directory not found"

  # ----------------------------------
  # CD — Staging
  # ----------------------------------
  deploy-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - run: echo " Deploying to staging..."
      - run: echo " Staging simulated"

  # ----------------------------------
  # CD — Production
  # ----------------------------------
  deploy-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - run: echo " Deploying to production..."
      - run: echo " Production simulated"
