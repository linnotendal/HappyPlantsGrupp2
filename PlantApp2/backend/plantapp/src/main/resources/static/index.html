<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Care App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>My Happy Plants</h1>
    </header>

    <main>
        <section id="plant-list">
            <h2>My Plants</h2>
            <div id="plants-container">
                <!-- Plants will be loaded here by JS -->
                <p>Loading plants...</p>
            </div>
        </section>

        <section id="add-plant">
            <h2>Add New Plant</h2>
            <form id="plant-form">
                <input type="text" id="plant-name" placeholder="Plant name" required>
                <input type="text" id="plant-species" placeholder="Species" required>
                <input type="number" id="watering-interval" placeholder="Days between watering" required>
                <button type="submit">Add Plant</button>
            </form>
        </section>
    </main>
</div>

<script src="js/models/Plant.js"></script>
<script src="js/services/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
