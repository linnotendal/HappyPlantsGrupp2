<!DOCTYPE html>
<html lang="sv">

<head >
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Happy Plants</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>My Happy Plants</h1>
            <nav>
                <button class="nav-btn active" onclick="showSection('library')"
                        data-tooltip="View your saved plants">
                    My Plants
                </button>
                <button class="nav-btn" onclick="showSection('discover')"
                        data-tooltip="View all available plants">
                    Discover
                </button>
                <button class="nav-btn" onclick="showSection('recommended')"
                        data-tooltip="Find new plants based on your library">
                    Recommendations
                </button>

                <button id="delete-btn" class="nav-btn delete"
                        data-tooltip="Delete">
                    Delete account
                </button>
                <button id="logout-btn" class="nav-btn logout"
                        data-tooltip="Log out from your account">
                    Log out
                </button>

                
            </nav>
        </header>

        <main>
            <!-- DISCOVER: Browse available plants -->
            <section id="discover-section" class="hidden">
                <h2>Discover Plants</h2>
                <p class="section-description">Find plants you like and add them to your library</p>
                <div class="search-box">
                    <input type="text" id="plant-search-input" placeholder="Search by plant name (e.g. Aloe)... "
                        oninput="handleSearch()">
                    <button class="btn-search" oninput="handleSearch()">Search</button>
                </div>
                <div id="discover-grid" class="plant-grid"></div>
            </section>

            <!-- LIBRARY: User's saved plants -->
            <section id="library-section">
                <h2>My Plants</h2>
                <p class="section-description">All your beautiful plants in one place</p>
                <div id="room-tabs" class="room-tabs"></div>
                <div class="search-box">
                    <input type="text" id="library-search-input" placeholder="Search in my plants..."
                        oninput="handleLibrarySearch()">
                </div>

                <div class="library-controls">
                    <select id="sort-library-select" onchange="handleSortChange()">
                        <option value="default">Default (Added date)</option>
                        <option value="water-status">Thirstiest First 💧</option>
                        <option value="name">Name (A-Z)</option>
                    </select>
                </div>

                <div id="library-grid" class="plant-grid"></div>
                <p id="empty-library-msg" class="empty-message">
                    You have no plants yet. Go to <strong>Discover</strong> to add some! 🌿
                </p>
            </section>

            <!-- Recommendations - based on users added plants -->
            <section id="recommended-section" class="hidden">
                <h2>Recommendations</h2>
                <p class="section-description">Here you can find recommended plants based on your current plants</p>
                <div id="recommended-grid" class="plant-grid"></div>
            </section>
        </main>
    </div>

    <div id="plant-modal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closePlantModal()">✕</button>
            <div id="plant-info-container"></div>
        </div>
    </div>

    <div id="plant-add-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlantAddModal()">&times;</span>
            <h3 id="modal-plant-name">🌿 Add Plant</h3>
            <label for="modal-nickname">Would you like to add a nickname to your plant?</label>
            <input type="text" id="modal-nickname" placeholder="Add a nickname (optional)" maxlength="30">
            <label for="modal-location">Would you like to specify the  location:</label>
            <select id="modal-location">
                <option value="" selected>Select room (optional)</option>
                <option value="Living Room">Living Room</option>
                <option value="Bedroom">Bedroom</option>
                <option value="Kitchen">Kitchen</option>
                <option value="Office">Office</option>
            </select>
            <button id="modal-add-btn">Add to My Plants</button>
        </div>
    </div>

    <script src="js/PlantTemplate.js"></script>
    <script src="js/userPlant.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
