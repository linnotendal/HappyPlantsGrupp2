<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HappyPlants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/loginStyle.css">
</head>

<body>
<div class="app-title-container">
    <h1 class="app-title">Happy Plants</h1>
</div>
<div class="register-container">
    <form id="register-form" class="register-form">
        <div class="input-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="Enter your email address">
        </div>
        <div class="input-group">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" placeholder="Enter your username">
        </div>
        <div class="input-group">
            <div class="label-row">
                <label for="reg-password">Password</label>
                <span class="field-hint" data-hint="Use at least 8 characters. Include uppercase, lowercase, numbers and symbols for a stronger password.">?</span>
            </div>
            <input type="password" id="reg-password" placeholder="Enter your password">
        </div>

        <button type="submit" class="register-button">Create Account</button>

        <p class="signup-link">Already a member? <a href="index.html">Log in</a></p>

        <p class="gdpr-notice">
            By creating an account, you agree that your email and username
            will be stored to provide the service, in accordance with GDPR.
        </p>
    </form>
</div>
<p id="message"></p>
</body>
</html>

<script src="js/login.js"></script>
